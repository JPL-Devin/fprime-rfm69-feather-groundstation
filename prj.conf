#################################
#### F Prime: Dependencies   ####
#################################
CONFIG_CPP=y
CONFIG_STD_CPP14=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=n
CONFIG_DYNAMIC_THREAD_PREFER_POOL=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_KERNEL_MEM_POOL=y
CONFIG_REBOOT=y
CONFIG_RING_BUFFER=y

###################################################################
#### Sized for ATSAMD21G18A (32 KiB RAM / 256 KiB flash)        ####
###################################################################
# One dynamic thread: the 1 kHz rate group task runs the radio poll plus the
# complete uplink and downlink port chains, so it gets a generous stack.
# (1024 tripped the stack sentinel on task startup; 2048 tripped it on the
# first uplink frame: uart recv -> ComStub -> FrameAccumulator -> FprimeDeframer
# -> Rfm69Manager TX staging all nest on this one thread.)
CONFIG_DYNAMIC_THREAD_STACK_SIZE=4096
# 1024 overflowed: the setup/radio-init call chain (topology -> loadParameters
# -> Rfm69 init -> port calls -> SPI driver) runs on the main stack and the
# stack sentinel trapped K_ERR_STACK_CHK_FAIL on z_main_thread. The overflow
# corrupted whatever RAM the linker placed below the main stack, which is what
# previously masqueraded as SPI/USB failures.
CONFIG_MAIN_STACK_SIZE=1536
CONFIG_DYNAMIC_THREAD_POOL_SIZE=1
CONFIG_ASSERT=y
# Trap thread stack overflows at the source instead of letting them corrupt
# adjacent RAM (which previously masqueraded as SPI/USB failures).
CONFIG_STACK_SENTINEL=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
# Keep filesystem so Os_File_Zephyr links; unused at runtime on this image
CONFIG_FILE_SYSTEM=y

#########################################
#### Consoles / USB CDC ACM bridge   ####
#########################################
# Text events (PassiveConsoleTextLogger -> Fw::Logger -> printk) go out
# SERCOM0 (D1/TX) to the FTDI. Keep USB CDC free of console traffic so the
# flight bridge stays a clean binary stream.
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="F Prime Feather M0 RFM69"
CONFIG_CDC_ACM_SERIAL_PID=0x800B
CONFIG_CDC_ACM_SERIAL_VID=0x239A
# Expose host line coding so the 1200-baud bootloader touch can read the baud
CONFIG_UART_LINE_CTRL=y


#########################################
#### Device support                  ####
#########################################
CONFIG_GPIO=y
CONFIG_PWM=n
CONFIG_I2C=n
CONFIG_SPI=y
CONFIG_PINCTRL=y

CONFIG_PRINTK=y
CONFIG_ISR_STACK_SIZE=512
CONFIG_IDLE_STACK_SIZE=256
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512

# F Prime queues and communication buffers allocate through libc malloc.
# Task stacks use the fixed dynamic-thread pool above, so leave no separate
# Zephyr k_malloc heap and give all otherwise-unused RAM to the libc arena.
CONFIG_HEAP_MEM_POOL_SIZE=0
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=-1
